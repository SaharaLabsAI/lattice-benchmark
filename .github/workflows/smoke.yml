name: smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile scoring package
        run: python -m compileall scoring
      - name: CLI help smoke
        run: |
          python -m scoring.batch --help
          python -m scoring.build_benchmark --help
